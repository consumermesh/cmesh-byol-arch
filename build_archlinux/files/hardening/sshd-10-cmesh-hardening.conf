# cmesh BYOL hardening — installed by cmesh-byol-harden as
# /etc/ssh/sshd_config.d/10-cmesh-hardening.conf
#
# sshd takes the FIRST value it sees for a keyword, and the Include in sshd_config comes
# before everything else, so this file wins over sshd_config and over Arch's
# 99-archlinux.conf (which only sets UsePAM yes, KbdInteractiveAuthentication no,
# PrintMotd no — none of which this file contradicts).
#
# Who may log in (PermitRootLogin / AllowUsers) is NOT here: it is written separately as
# 20-cmesh-users.conf, and only once a non-root admin account with a working key exists,
# so a half-finished hardening run can never lock the machine.

# Keys only. No passwords exist on this system, so say so rather than rely on that.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey
PubkeyAuthentication yes
HostbasedAuthentication no
IgnoreRhosts yes
PermitUserEnvironment no
StrictModes yes

# Brute-force and session limits. sshguard bans repeat offenders; these keep each attempt
# cheap.
MaxAuthTries 3
MaxSessions 4
MaxStartups 10:30:60
LoginGraceTime 30

# Automatic logoff (HIPAA 164.312(a)(2)(iii)): an idle session is dropped after
# 300 s x 2 = 10 minutes of no response.
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive no

# This host serves no X, no tunnels, no agent hops.
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no

# Pre-authentication notice. /etc/motd is shown AFTER login and does not count.
Banner /etc/issue.net

# Modern algorithms only. PubkeyAcceptedAlgorithms is deliberately left at the default:
# the operator keys in deploy.json may be ecdsa, and narrowing it is how you lock
# yourself out.
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256,ecdsa-sha2-nistp521,ecdsa-sha2-nistp384,ecdsa-sha2-nistp256

# VERBOSE logs the key fingerprint used for every login — that is the audit trail of WHO
# logged in, not just which account.
LogLevel VERBOSE
UseDNS no
Compression no
