# cmesh BYOL hardening — /etc/smartd.conf
# Scan every drive; attributes, self-test log, error log; short self-test daily at 02:00,
# long test Saturdays at 03:00; temperature warnings at 50/55 C. Alerts go through
# cmesh-alert (journal + /var/log/cmesh-alerts.log), never through mail.
DEVICESCAN -a -o on -S on -n standby,q -W 4,50,55 -s (S/../.././02|L/../../6/03) -m <nomailer> -M exec /usr/local/sbin/cmesh-alert
