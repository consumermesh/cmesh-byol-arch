# cmesh BYOL hardening — /etc/systemd/system/mdmonitor.service.d/override.conf
# Arch's unit runs `mdadm --monitor --scan` with no destination for alerts, so without a
# MAILADDR or PROGRAM in mdadm.conf it exits immediately with "No mail address or alert
# command". --syslog puts every event (DegradedArray, Fail, SpareActive, Rebuild*) in the
# journal, and the PROGRAM line that cmesh-byol-harden adds to mdadm.conf routes them to
# cmesh-alert as well.
[Service]
ExecStart=
ExecStart=/usr/bin/mdadm --monitor --scan --syslog
