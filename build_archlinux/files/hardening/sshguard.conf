# cmesh BYOL hardening — /etc/sshguard.conf
# Arch's shipped default uses the iptables backend; this host runs nftables. sshguard
# keeps its blocklist in its own tables (ip sshguard / ip6 sshguard), which the main
# ruleset in /etc/nftables.conf leaves alone on reload.
LOGREADER="LANG=C /usr/bin/journalctl -afb -p info -n1 -t sshd -t sshd-session -o cat"
BACKEND="/usr/lib/sshguard/sshg-fw-nft-sets"
# Ban after 30 points (an auth failure is 10): 3 failures, then 2 minutes, doubling each
# time, and a permanent entry after 120 points of history.
THRESHOLD=30
BLOCK_TIME=120
DETECTION_TIME=1800
BLACKLIST_FILE=120:/var/db/sshguard/blacklist.db
# Addresses in this file are never blocked, whatever they do. Without it a client that
# fails SSH auth in a loop can ban your own management address: 3 failures reach
# THRESHOLD, repeat bans double, and 120 points is a permanent blacklist entry. Seeded
# by cmesh-byol-harden when absent; edits are kept. See sshguard.whitelist.
WHITELIST_FILE=/etc/sshguard/whitelist
