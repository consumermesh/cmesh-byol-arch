# cmesh BYOL hardening — /etc/systemd/journald.conf.d/50-cmesh.conf
#
# The journal is the audit trail for everything that is not auditd: sshd logins with key
# fingerprints, sudo, service starts and failures, mdadm and smartd alerts, cmesh-alert.
# It must survive a reboot and must not be allowed to eat the 8 GiB root.
#
# Seal=yes enables Forward Secure Sealing once keys exist: run `journalctl --setup-keys`
# once and store the verification key off the machine; `journalctl --verify` then
# detects a journal edited after the fact. Without the keys the setting is inert.
#
# Local retention is bounded. HIPAA-grade retention (years) belongs to the off-box copy:
# point systemd-journal-upload or a log shipper at your collector. See README.
[Journal]
Storage=persistent
Compress=yes
Seal=yes
SystemMaxUse=512M
SystemKeepFree=1G
MaxRetentionSec=1year
ForwardToSyslog=no
RateLimitIntervalSec=30s
RateLimitBurst=20000
