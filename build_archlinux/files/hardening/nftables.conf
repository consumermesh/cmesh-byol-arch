#!/usr/bin/nft -f
# cmesh BYOL hardening — installed by cmesh-byol-harden as /etc/nftables.conf
#
# Default deny inbound; SSH from the management ranges only, rate limited; nothing is
# forwarded. The established/related rule comes first so an active SSH session survives
# `nft -f` reloads, including the one that installs this file.
#
# Restrict SSH to where you administer from. 0.0.0.0/0 is a placeholder that allows
# everywhere; replace it with your office, VPN, or bastion addresses and reload with
# `nft -f /etc/nftables.conf` (`nft -c -f` checks first).
define ssh_allowed_v4 = { 0.0.0.0/0 }

# SSH over IPv6 is OFF by default: management networks are usually IPv4-only, and nft
# has no empty set to express "no v6 sources". To enable it, uncomment this define and
# the two "ssh v6" rules in the input chain. ICMPv6 stays open regardless; the host
# still needs neighbour discovery.
# define ssh_allowed_v6 = { 2001:db8::/32 }

# Only this table is replaced. sshguard keeps its own tables (ip/ip6 sshguard) with the
# blocklist sets; they must not be flushed on a firewall reload.
destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop comment "drop invalid"
    ct state { established, related } accept comment "tracked connections"
    iif lo accept comment "loopback"

    # ICMP: needed for path MTU, neighbour discovery, and the OVHcloud monitoring pings
    # that decide whether the host is declared down.
    meta l4proto icmp icmp type { destination-unreachable, time-exceeded, parameter-problem, echo-request } accept comment "icmp"
    meta l4proto ipv6-icmp accept comment "icmpv6"

    # SSH: new connections only from the management ranges, and no more than 10 a minute
    # per source. Legitimate admins never hit that; scanners do immediately.
    tcp dport 22 ip saddr $ssh_allowed_v4 ct state new limit rate over 10/minute burst 5 packets drop comment "ssh rate limit"
    tcp dport 22 ip saddr $ssh_allowed_v4 accept comment "ssh"
    # IPv6 SSH, disabled by default (see the define above):
    # tcp dport 22 ip6 saddr $ssh_allowed_v6 ct state new limit rate over 10/minute burst 5 packets drop comment "ssh rate limit v6"
    # tcp dport 22 ip6 saddr $ssh_allowed_v6 accept comment "ssh v6"

    # Everything else: a courteous reject for hosts (not broadcast), capped so a flood
    # cannot turn the reply into amplification; then the policy drop.
    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter comment "dropped"
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
