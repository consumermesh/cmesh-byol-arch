name: KVM mechanism probe

# Throwaway diagnostic #2. The first probe established that KVM works on hosted
# runners once the kvm GROUP is applied. This one establishes HOW to apply it
# reliably, because build.sh's `sg kvm -c true` gate evidently failed while
# `sg kvm -c '<qemu ...>'` had worked:
#
#   * does `sg kvm -c true` return 0?
#   * does `id -Gn` inside `sg kvm -c` show kvm?
#   * does qemu actually start under -accel kvm through the mechanism?
#
# Delete once answered.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Inspect the sg mechanism
        run: |
          set -x
          whoami
          id -Gn
          # runner is not in kvm yet; add it (has no effect on this session)
          sudo usermod -aG kvm "$(whoami)" || true

          echo "--- sg kvm -c true ---"
          sg kvm -c true; echo "exit=$?"

          echo "--- groups inside sg kvm ---"
          sg kvm -c 'id -Gn'; echo "exit=$?"

          echo "--- qemu under sg kvm ---"
          sg kvm -c 'timeout 8 qemu-system-x86_64 -accel kvm -machine pc -m 128 \
            -display none -monitor none -serial none -no-reboot' 2>&1 | tail -3
          echo "qemu_exit=$?"

          echo "--- qemu under sudo -g kvm (alternative mechanism) ---"
          sudo -g kvm -- sh -c 'timeout 8 qemu-system-x86_64 -accel kvm -machine pc \
            -m 128 -display none -monitor none -serial none -no-reboot' 2>&1 | tail -3
          echo "sudo_g_exit=$?"

          echo "--- does a fresh login session pick up the group via newgrp? ---"
          newgrp kvm </dev/null >/dev/null 2>&1; echo "newgrp_exit=$?"
