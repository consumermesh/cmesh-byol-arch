name: sg gate probe

# Throwaway diagnostic #3. build.sh enters its re-exec branch and then fails the
# verification that `sg kvm` actually granted the group, while probe #2 showed
# `sg kvm -c 'id -Gn'` returning "kvm adm users docker systemd-journal runner".
#
# So one of the two must be untrue. This runs the EXACT expressions from build.sh and
# prints every intermediate result, so the disagreement is visible instead of inferred.
#
# Delete once answered.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Exact build.sh expressions
        run: |
          set -x
          echo "A) outer id -Gn: $(id -Gn)"

          in_group() { id -Gn | tr ' ' '\n' | grep -qx kvm; }
          if in_group; then echo "B) in_group: yes"; else echo "B) in_group: no"; fi

          echo "C) command -v sg: $(command -v sg || echo MISSING)"

          echo "D) does the group kvm exist at all? $(getent group kvm || echo NO-SUCH-GROUP)"

          echo "E) sg kvm -c 'id -Gn' raw:"
          sg kvm -c 'id -Gn'; echo "E_exit=$?"

          echo "F) the EXACT verification build.sh uses:"
          if sg kvm -c 'id -Gn | tr " " "\n" | grep -qx kvm'; then
            echo "F) VERIFIED — group present inside sg"
          else
            echo "F) FAILED — group NOT seen inside sg (exit $?)"
          fi

          echo "G) same test, inner grep exit status broken out:"
          sg kvm -c 'id -Gn | tr " " "\n" | grep -qx kvm'; echo "G_exit=$?"

          echo "H) is /dev/kvm openable inside sg (qemu test, the only valid one):"
          sg kvm -c 'timeout 6 qemu-system-x86_64 -accel kvm -machine pc -m 128 \
            -display none -monitor none -serial none -no-reboot' 2>&1 | tail -2
          echo "H_note=timeout kill is SUCCESS"

          echo "I) sudo -g kvm variant, for comparison:"
          sudo -g kvm sh -c 'timeout 6 qemu-system-x86_64 -accel kvm -machine pc -m 128 \
            -display none -monitor none -serial none -no-reboot' 2>&1 | tail -2
          echo "I_note=timeout kill is SUCCESS"
