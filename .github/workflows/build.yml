name: Builder

# Builds the BYOL image and attaches it to a GitHub Release.
#
# Release asset URLs are what go into the OVHcloud console / BYOLinux API, so the asset
# name and checksum file name are part of the interface:
#
#   https://github.com/consumermesh/cmesh-byol-arch/releases/download/<tag>/archlinux.qcow2
#   https://github.com/consumermesh/cmesh-byol-arch/releases/download/<tag>/archlinux.qcow2.sha512
#
# Do not rename them without updating the README and every server's configDriveUserData.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The image is built by booting QEMU with KVM, so a Linux runner with /dev/kvm is
    # required. The GitHub-hosted ubuntu runners provide it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install packer and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils genisoimage
          curl -fsSL -o /tmp/packer.zip \
            "https://releases.hashicorp.com/packer/1.11.2/packer_1.11.2_linux_amd64.zip"
          sudo unzip -o /tmp/packer.zip -d /usr/local/bin
          packer version
          qemu-system-x86_64 --version | head -1

      # /dev/kvm existing is NOT sufficient: GitHub's hosted runners create the node
      # but deny the runner user access to it, so QEMU fails with
      #   "Could not access KVM kernel module: Permission denied"
      # after the build has already started. Test that KVM can actually be used, and
      # fall back to tcg (software emulation) — slower, but it works.
      #
      # NOTE: on GitHub-hosted runners this is expected to select tcg, and a full build
      # under tcg can exceed the job timeout. The fast, reliable path is to build on the
      # target server itself (or any machine with real KVM) — see the README.
      - name: Choose accelerator
        id: accel
        run: |
          accel=tcg
          if [ ! -e /dev/kvm ]; then
            echo "::warning::/dev/kvm absent — building under tcg (slow)"
          elif ! dd if=/dev/kvm of=/dev/null bs=1 count=1 status=none 2>/dev/null; then
            # The node exists but the runner user cannot open it. This is the
            # GitHub-hosted-runner case, and it is why `test -e` is not enough.
            echo "::warning::/dev/kvm present but not openable — building under tcg (slow)"
          elif ! qemu-system-x86_64 -accel help 2>/dev/null | grep -qw kvm; then
            echo "::warning::this qemu has no kvm accelerator — building under tcg"
          else
            accel=kvm
            echo "KVM usable — building with hardware acceleration"
          fi
          echo "accelerator=$accel" >> "$GITHUB_OUTPUT"

      # Run from the repository root: the HCL's provisioner paths are resolved
      # relative to the working directory, and `packer init` needs the HCL path.
      - name: Build image
        env:
          PACKER_LOG: "1"
        run: |
          packer init build_archlinux/archlinux.pkr.hcl
          packer build -var accelerator=${{ steps.accel.outputs.accelerator }} \
            build_archlinux/archlinux.pkr.hcl

      - name: Checksum the image
        working-directory: build_archlinux
        run: |
          test -f output/archlinux.qcow2
          # sha512 to match OVH's imageCheckSumType: "sha512".
          sha512sum output/archlinux.qcow2 | awk '{print $1}' > output/archlinux.qcow2.sha512
          # A bare digest, so the value can be pasted straight into imageCheckSum.
          sha512sum output/archlinux.qcow2 > output/archlinux.qcow2.sha512.txt
          echo "--- image ---"
          ls -lh output/archlinux.qcow2
          echo "--- sha512 ---"
          cat output/archlinux.qcow2.sha512

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-qcow2
          path: |
            build_archlinux/output/archlinux.qcow2
            build_archlinux/output/archlinux.qcow2.sha512
            build_archlinux/output/archlinux.qcow2.sha512.txt
          if-no-files-found: error
          retention-days: 14

      # Only tag pushes produce a release; a workflow_dispatch run just gives you the
      # artifact to test with.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" \
            build_archlinux/output/archlinux.qcow2 \
            build_archlinux/output/archlinux.qcow2.sha512 \
            build_archlinux/output/archlinux.qcow2.sha512.txt \
            --clobber
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo "imageURL:      https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/archlinux.qcow2" >> "$GITHUB_STEP_SUMMARY"
          echo "imageCheckSum: $(cat build_archlinux/output/archlinux.qcow2.sha512)" >> "$GITHUB_STEP_SUMMARY"
